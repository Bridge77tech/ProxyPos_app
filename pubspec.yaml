name: inventory_app_pos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  hive: ^2.2.3
  nb_utils: ^7.2.0
  go_router: ^17.0.1
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.1
  toastification: ^3.0.3
  hive_ce_flutter: ^2.3.4
  equatable: ^2.0.8
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  loader_overlay: ^5.0.0
  hive_ce: ^2.19.1
  fasaha_utils:
    path: ../fasaha_utils
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.10.0
  internet_connection_checker_plus: ^2.9.1+2
  logger: ^2.6.2
  dio_smart_retry: ^7.0.1
#    git:
#      url: https://github.com/fasaha-tech/fasaha_utils.git
#      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  retrofit_generator: ^10.0.6
  build_runner: ^2.10.5
  hive_ce_generator: ^1.10.0
  freezed: ^3.2.3
  json_serializable: ^6.12.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  # example:
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
        - asset: assets/fonts/Satoshi-Italic.otf
          style: italic
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 200
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500

    - family: Fontspring-DEMO-integralcf
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-integralcf-regular.otf
        - asset: assets/fonts/Fontspring-DEMO-integralcf-demibold.otf
          weight: 600